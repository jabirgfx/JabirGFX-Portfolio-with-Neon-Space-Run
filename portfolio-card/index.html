<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Md Jabir Hossain — Glassmorphism Portrait Card</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- CSS Link -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PORTRAIT CARD -->
  <div class="portrait-card-wrapper">
    <div class="portrait-card">
      
      <!-- Full Background Image -->
      <img src="apnar-photo.jpg" alt="Md Jabir Hossain" class="card-bg-image">
      
      <!-- Gradient Overlay -->
      <div class="card-overlay"></div>

      <!-- Card Top Header -->
      <div class="card-header">
        <div class="card-top-left">
          <span class="dp-tag">DP / PORTRAIT</span>
          <span class="category-tag">CREATIVE DIRECTORY</span>
        </div>

        <div class="card-top-right">
          <div class="star-icon">✦</div>
          <div class="floating-badge">
            <span>design with a voice</span>
            <span class="sparkle">✦</span>
          </div>
        </div>
      </div>

      <!-- Bottom Edge-to-Edge Glassmorphism Section -->
      <div class="glass-footer-panel">
        <div class="card-footer-content">
          <div class="footer-left">
            <h2 class="brand-title">MD JABIR HOSSAIN</h2>
            <p class="brand-subtitle">DESIGN · WORDS · PRESENCE</p>
          </div>
          <div class="footer-right">
            <span class="edition-tag">2026 EDITION</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JS Link -->
  <script src="script.js"></script>
</body>
</html>
